name: Generar musica aprobada

on:
  push:
    branches:
      - "produccion/musica-*"
    paths:
      - "solicitudes/musica/solicitud.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: musica-${{ github.ref }}
  cancel-in-progress: false

jobs:
  musica:
    if: github.repository_owner == 'pedroangel62-blip'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar solicitud, sincronizacion y limite
        id: solicitud
        run: |
          python scripts/generar_musica_aprobada.py \
            --solicitud solicitudes/musica/solicitud.json \
            --solo-validar \
            --github-output "$GITHUB_OUTPUT"

      - name: Comprobar secreto sin consumir creditos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          test -n "$ELEVENLABS_API_KEY" || {
            echo "Falta el secreto ELEVENLABS_API_KEY."
            exit 1
          }
          echo "El secreto necesario esta configurado."

      - name: Confirmar comprobacion sin generacion
        if: steps.solicitud.outputs.accion == 'comprobar'
        run: echo "Configuracion valida; no se ha llamado a ElevenLabs."

      - name: Bloquear solicitudes ya generadas
        if: steps.solicitud.outputs.accion == 'generar'
        env:
          GH_TOKEN: ${{ github.token }}
          NOMBRE_ARTEFACTO: musica-${{ steps.solicitud.outputs.solicitud_id }}
        run: |
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NOMBRE_ARTEFACTO" \
            --output /tmp/artefactos.json
          python - <<'PY'
          import json
          with open('/tmp/artefactos.json', encoding='utf-8') as archivo:
              datos = json.load(archivo)
          if datos.get('total_count', 0):
              raise SystemExit(
                  'Esta solicitud ya tiene un artefacto y no se repetira.'
              )
          PY

      - name: Generar una unica pista musical
        id: generar
        if: steps.solicitud.outputs.accion == 'generar'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/generar_musica_aprobada.py \
            --solicitud solicitudes/musica/solicitud.json \
            --salida salida-musica

      - name: Guardar resultado para revision
        if: always() && steps.solicitud.outputs.accion == 'generar'
        uses: actions/upload-artifact@v4
        with:
          name: musica-${{ steps.solicitud.outputs.solicitud_id }}
          path: salida-musica
          if-no-files-found: warn
          retention-days: 30
