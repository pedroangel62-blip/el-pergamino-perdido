name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Comprobar FFmpeg
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -n 1
          else
            echo "FFmpeg no está disponible; la prueba de montaje se omitirá."
          fi

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: |
          python -m py_compile \
            backend/main.py \
            backend/montaje_worker.py \
            backend/imagenes.py \
            backend/busqueda_imagenes.py \
            backend/voz.py \
            backend/produccion_remota.py \
            backend/indice_temas.py \
            backend/produccion.py \
            backend/instagram.py

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

  compatibilidad-windows:
    name: Compatibilidad Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        shell: pwsh
        run: |
          python -m py_compile `
            backend/main.py `
            backend/montaje_worker.py `
            backend/imagenes.py `
            backend/busqueda_imagenes.py `
            backend/voz.py `
            backend/produccion_remota.py `
            backend/indice_temas.py `
            backend/produccion.py `
            backend/instagram.py

      - name: Probar compatibilidad del worker
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_app.AplicacionTests.test_worker_usa_proceso_oculto_y_desacoplado
          tests.test_app.AplicacionTests.test_montaje_se_lanza_en_proceso_independiente
          -v
