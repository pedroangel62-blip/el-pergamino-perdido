name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Comprobar FFmpeg
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version | head -n 1
          else
            echo "FFmpeg no está disponible; la prueba de montaje se omitirá."
          fi

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: |
          python -m py_compile \
            backend/main.py \
            backend/montaje_worker.py \
            backend/imagenes.py \
            backend/busqueda_imagenes.py \
            backend/voz.py \
            backend/produccion_remota.py \
            backend/indice_temas.py \
            backend/produccion.py \
            backend/instagram.py

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Configurar Node para el navegador
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar herramienta de navegador
        run: npm install --no-save --prefix "$RUNNER_TEMP/pergamino-browser" agent-browser@0.38.1

      - name: Probar Play y descarga con Chrome real
        run: |
          export PERGAMINO_BROWSER_BIN="$RUNNER_TEMP/pergamino-browser/node_modules/.bin/agent-browser"
          python -m tests.verificar_video_navegador

  compatibilidad-windows:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        shell: pwsh
        run: |
          python -m py_compile `
            backend/main.py `
            backend/montaje_worker.py `
            backend/imagenes.py `
            backend/busqueda_imagenes.py `
            backend/voz.py `
            backend/produccion_remota.py `
            backend/indice_temas.py `
            backend/produccion.py `
            backend/instagram.py

      - name: Probar API, archivo bloqueado y progreso con proceso real
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_app
          tests.test_entrega_video
          -v

      - name: Comprobar diagnostico de solo lectura en Windows
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "pergamino-diagnostico"
          $project = Join-Path $root "backend\proyectos\pergamino-prueba"
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          $video = Join-Path $project "video_borrador.mp4"
          [System.IO.File]::WriteAllBytes($video, [byte[]](1, 2, 3))
          $before = (Get-FileHash -LiteralPath $video).Hash
          & .\scripts\diagnosticar-video.ps1 -ProjectRoot $root -ProyectoId "pergamino-prueba" -NoAbrir
          if ((Get-FileHash -LiteralPath $video).Hash -ne $before) { throw "El diagnostico altero el video" }
